id = "madebygrant.herdr-matrix"
name = "Matrix"
version = "0.6.0"
min_herdr_version = "0.8.2"
description = "Matrix theming for Herdr: Agent names, space numbers, idle rain and exit messages"
platforms = ["macos", "linux"]

[[startup]]
command = ["python3", "-I", "matrix.py", "startup"]

[[events]]
on = "pane.agent_detected"
command = ["python3", "-I", "matrix.py"]

[[events]]
on = "pane.agent_status_changed"
command = ["python3", "-I", "matrix.py"]

[[events]]
on = "pane.closed"
command = ["python3", "-I", "matrix.py"]

[[events]]
on = "pane.exited"
command = ["python3", "-I", "matrix.py"]

[[events]]
on = "tab.closed"
command = ["python3", "-I", "matrix.py"]

[[events]]
on = "workspace.closed"
command = ["python3", "-I", "matrix.py"]

[[events]]
on = "workspace.created"
command = ["python3", "-I", "matrix.py"]

[[events]]
on = "workspace.renamed"
command = ["python3", "-I", "matrix.py"]

[[events]]
on = "workspace.moved"
command = ["python3", "-I", "matrix.py"]

[[events]]
on = "workspace.reordered"
command = ["python3", "-I", "matrix.py"]

# Herdr relabels a workspace after a cd without emitting any event; auto-title's
# tab rename is the only signal that follows it.
[[events]]
on = "tab.renamed"
command = ["python3", "-I", "matrix.py"]

[[panes]]
id = "rain"
title = "Rain"
placement = "overlay"
command = ["python3", "-I", "rain.py"]

[[actions]]
id = "mark-space"
title = "Matrix: mark or unmark this space for boss mode"
description = "Toggle whether boss mode covers the focused space"
contexts = ["global"]
command = ["python3", "-I", "matrix.py", "mark-space"]

[[actions]]
id = "boss-mode"
title = "Matrix: toggle boss mode"
description = "Hide agents in marked spaces and give the spaces cover names"
contexts = ["global"]
command = ["python3", "-I", "matrix.py", "boss-mode"]

[[actions]]
id = "open-in-zed"
title = "Matrix: open this space in Zed"
description = "Open the focused space's directory in the running Zed app"
contexts = ["global"]
command = ["python3", "-I", "matrix.py", "open-in-zed"]

[[actions]]
id = "open-in-vscode"
title = "Matrix: open this space in VS Code"
description = "Open the focused space's directory in the last active VS Code window"
contexts = ["global"]
command = ["python3", "-I", "matrix.py", "open-in-vscode"]
